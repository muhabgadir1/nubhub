# NUBHUB is a plain static bundle — no secrets at build time, so Netlify can
# build it itself rather than taking an uploaded dist/.
[build]
  publish = "dist"
  command = "npm run build"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Everything under /assets is content-hashed, so it can be cached hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
