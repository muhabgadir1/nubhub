<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <title>NUBHUB</title>
    <meta name="description" content="NUBHUB — RummiNUB, WordNUB, ConnectNUB and MathNUB in one place." />
    <meta name="theme-color" content="#1a0206" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NUBHUB" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- RummiNUB's two faces, and the only two used here: Source Serif 4 for
         headings, names and buttons; Archivo for UI text. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700;0,8..60,800;1,8..60,600&family=Archivo:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- Netlify finds forms by scanning the deployed HTML at build time, and
         a React-rendered form is invisible to that scan. This hidden copy is
         what registers the form and its fields; WordNUB's suggestion card
         posts the same field names to "/". Submissions land in the Netlify
         dashboard under Forms, so there is no backend to run. -->
    <form name="word-suggestion" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="word" />
      <input type="text" name="length" />
      <input type="text" name="note" />
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
